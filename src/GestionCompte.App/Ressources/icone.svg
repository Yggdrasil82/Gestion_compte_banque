<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Icône de l'application : vieux canard grippe-sou au haut-de-forme, assis sur un coffre-fort. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1976D2"/><stop offset="1" stop-color="#00A3A3"/></linearGradient>
    <radialGradient id="reflet" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="plume" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#EEF3F8"/><stop offset="1" stop-color="#B9C8D8"/></radialGradient>
    <radialGradient id="tete" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.65" stop-color="#F0F4F9"/><stop offset="1" stop-color="#BFCCDC"/></radialGradient>
    <linearGradient id="bec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC04D"/><stop offset="1" stop-color="#E07B00"/></linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="0.45" stop-color="#FFC530"/><stop offset="1" stop-color="#D68A0C"/></linearGradient>
    <radialGradient id="euro" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF1B8"/><stop offset="0.5" stop-color="#FFC530"/><stop offset="1" stop-color="#C77F08"/></radialGradient>
    <linearGradient id="chapeau" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A4458"/><stop offset="0.35" stop-color="#1D2433"/><stop offset="1" stop-color="#0B0F18"/></linearGradient>
    <radialGradient id="verre" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE3F5"/></radialGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#06253F" flood-opacity="0.45"/></filter>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AA8BA"/><stop offset="0.5" stop-color="#6F7F95"/><stop offset="1" stop-color="#4A5669"/></linearGradient>
    <radialGradient id="molette" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#E4EAF2"/><stop offset="1" stop-color="#8E9CB0"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fond)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#reflet)"/>

  <g filter="url(#ombre)">
    <!-- Coffre-fort -->
    <path d="M64 170 l12 -12 h118 l-12 12 z" fill="#6F7F95"/>
    <path d="M182 170 l12 -12 v62 l-12 12 z" fill="#3E4A5C"/>
    <rect x="64" y="170" width="118" height="62" rx="6" fill="url(#acier)"/>
    <rect x="72" y="177" width="102" height="48" rx="5" fill="none" stroke="#2C3646" stroke-width="2.5"/>
    <!-- Molette -->
    <circle cx="100" cy="204" r="13" fill="url(#molette)" stroke="#2C3646" stroke-width="2.5"/>
    <circle cx="100" cy="204" r="4.5" fill="#2C3646"/>
    <path d="M100 191 v4 M100 213 v4 M87 204 h4 M109 204 h4 M90.8 194.8 l3 3 M106.2 210.2 l3 3 M90.8 213.2 l3 -3 M106.2 197.8 l3 -3" stroke="#2C3646" stroke-width="1.8"/>
    <!-- Poignée et charnières -->
    <rect x="154" y="200" width="16" height="16" rx="4" fill="url(#piece)" stroke="#9A5E06" stroke-width="1.5"/>
    <path d="M162 204 v8" stroke="#9A5E06" stroke-width="3" stroke-linecap="round"/>
    <rect x="66" y="180" width="5" height="10" rx="2" fill="#2C3646"/>
    <rect x="66" y="212" width="5" height="10" rx="2" fill="#2C3646"/>
    <!-- Pièces posées au pied du coffre -->
    <ellipse cx="200" cy="232" rx="14" ry="5" fill="#B8740A"/><ellipse cx="200" cy="229" rx="14" ry="5" fill="url(#piece)"/>
    <ellipse cx="54" cy="233" rx="12" ry="4.5" fill="#B8740A"/><ellipse cx="54" cy="230" rx="12" ry="4.5" fill="url(#piece)"/>

    <!-- Corps et queue -->
    <path d="M166 136 q20 -2 22 14 q-12 -4 -22 2 z" fill="url(#plume)"/>
    <ellipse cx="128" cy="140" rx="46" ry="33" fill="url(#plume)"/>
    <path d="M150 128 q22 -6 30 -12 q2 16 -16 24 q-12 4 -18 -2 z" fill="url(#plume)" stroke="#C9D5E3" stroke-width="1.5"/>
    <path d="M104 134 q16 18 40 8" fill="none" stroke="#C9D5E3" stroke-width="3" stroke-linecap="round"/>

    <!-- Pattes palmées qui pendent sur la pile -->
    <g fill="url(#bec)" stroke="#B35F00" stroke-width="2" stroke-linejoin="round">
      <path d="M108 168 v10 l-12 12 q6 4 10 0 q3 5 8 2 q4 4 8 -1 l-8 -13 v-10 z"/>
      <path d="M142 168 v10 l-8 13 q4 5 8 1 q5 3 8 -2 q4 4 10 0 l-12 -12 v-10 z"/>
    </g>
    <path d="M104 186 l4 -6 M112 188 l2 -8 M146 188 l-2 -8 M154 186 l-4 -6" stroke="#B35F00" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tête -->
    <circle cx="118" cy="96" r="34" fill="url(#tete)"/>
    <!-- Joues -->
    <ellipse cx="100" cy="110" rx="7" ry="4" fill="#FFB3B3" opacity="0"/>
    <ellipse cx="140" cy="110" rx="7" ry="4" fill="#FFB3B3" opacity="0"/>

    <!-- Bec : large bec de canard, vu de face, souriant -->
    <path d="M94 108 q24 -10 48 0 q2 12 -24 16 q-26 -4 -24 -16 z" fill="url(#bec)"/>
    <path d="M98 112 q18 4 36 -2 q4 -2 6 -6" fill="none" stroke="#B35F00" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="112" cy="106" rx="1.8" ry="1.2" fill="#B35F00"/>
    <ellipse cx="124" cy="106" rx="1.8" ry="1.2" fill="#B35F00"/>
    <ellipse cx="110" cy="104" rx="8" ry="2.2" fill="#FFE2A8" opacity="0.8"/>

    <!-- Yeux : un monocle doré sur l'œil droit -->
    <ellipse cx="106" cy="88" rx="7" ry="8.5" fill="#fff" stroke="#9FB0C4" stroke-width="1"/>
    <ellipse cx="130" cy="88" rx="7" ry="8.5" fill="#fff" stroke="#9FB0C4" stroke-width="1"/>
    <circle cx="110" cy="90" r="4.2" fill="#1D2433"/>
    <circle cx="133" cy="90" r="4.2" fill="#1D2433"/>
    <circle cx="111.5" cy="88.8" r="1.4" fill="#fff"/>
    <circle cx="134.5" cy="88.8" r="1.4" fill="#fff"/>
    <path d="M98.5 86 q7.5 -6 15 0 v-7 h-15 z" fill="#E9EEF4" stroke="#9FB0C4" stroke-width="1.2"/>
    <path d="M122.5 86 q7.5 -6 15 0 v-7 h-15 z" fill="#E9EEF4" stroke="#9FB0C4" stroke-width="1.2"/>
    <circle cx="130" cy="88" r="12" fill="#E6F1FC" fill-opacity="0.35" stroke="url(#piece)" stroke-width="3.5"/>
    <path d="M140 95 q10 14 4 30" fill="none" stroke="#D6A21E" stroke-width="1.5"/>
    <!-- Sourcils broussailleux -->
    <path d="M95 72 L115 80 M141 72 L121 80" fill="none" stroke="#8394AA" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Favoris -->
    <path d="M86 98 q-10 6 -6 16 q6 -2 10 -8 q-2 8 4 12 q2 -10 2 -18 z" fill="#E4E9F0" stroke="#B9C6D6" stroke-width="1"/>
    <path d="M150 98 q10 6 6 16 q-6 -2 -10 -8 q2 8 -4 12 q-2 -10 -2 -18 z" fill="#E4E9F0" stroke="#B9C6D6" stroke-width="1"/>
    <!-- Nœud papillon vert -->
    <path d="M118 130 l-16 -9 v18 z M118 130 l16 -9 v18 z" fill="#1E9E6A" stroke="#136B47" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="118" cy="130" r="4.5" fill="#136B47"/>

    <!-- Haut-de-forme -->
    <ellipse cx="120" cy="64" rx="30" ry="6" fill="#0B0F18" transform="rotate(8 120 64)"/>
    <rect x="102" y="28" width="36" height="36" rx="4" fill="url(#chapeau)" transform="rotate(8 120 64)"/>
    <ellipse cx="120" cy="28" rx="18" ry="4" fill="#4A566D" transform="rotate(8 120 64)"/>
    <rect x="102" y="51" width="36" height="7" fill="#D93A3A" transform="rotate(8 120 64)"/>
    <rect x="102" y="51" width="36" height="2.5" fill="#F07A7A" transform="rotate(8 120 64)"/>
    <rect x="107" y="32" width="5" height="18" rx="2.5" fill="#fff" opacity="0.18" transform="rotate(8 120 64)"/>

    <!-- Canne -->
    <path d="M58 228 L84 138" stroke="#5A361C" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 138 q2 -14 14 -12 q8 2 6 10" fill="none" stroke="url(#piece)" stroke-width="7" stroke-linecap="round"/>
    <!-- Pièce en euro -->
    <circle cx="178" cy="122" r="20" fill="#B8740A"/>
    <circle cx="178" cy="119" r="19" fill="url(#euro)" stroke="#FFF1B8" stroke-width="3"/>
    <path d="M185 111 a9.5 9.5 0 1 0 0 16" fill="none" stroke="#9A5E06" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M169 116 h13 M169 122 h13" stroke="#9A5E06" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="172" cy="111" rx="7" ry="3.5" fill="#fff" opacity="0.55" transform="rotate(-25 172 111)"/>
  </g>
</svg>

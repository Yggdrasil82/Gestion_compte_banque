name: Publier une version

# Lancé à la main une fois une version validée : l'exe déjà compilé par « Application Windows » (run_id) est publié
# sur la page « Releases » du dépôt, avec les nouveautés du README. L'application y cherche ses mises à jour.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro de l'exécution « Application Windows » dont l'exe a été validé"
        required: true
  # Ou par un envoi sur une branche « publier-<run_id> » (supprimée une fois la version publiée).
  push:
    branches:
      - 'publier-*'

permissions:
  contents: write
  actions: read

jobs:
  publier:
    name: Publication de la version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      RUN_ID: ${{ inputs.run_id || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Exe validé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${RUN_ID#publier-}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --name GestionCompte-windows --dir publication
          ls -l publication/GestionCompte.exe

      - name: Version et nouveautés
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GestionCompte.App/GestionCompte.App.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Ligne « - **x.y.z** : … » du README, découpée en une nouveauté par ligne.
          grep -F -- "- **$version** :" README.md | sed "s/^- \*\*$version\*\* : //" | sed 's/ ; /\n- /g; s/^/- /' > notes.md
          [ -s notes.md ] || echo "Corrections et améliorations." > notes.md
          cat notes.md

      - name: Publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # L'étiquette va sur la branche principale : le jeton de l'action ne peut pas étiqueter un commit
          # dont les workflows ne sont pas encore sur cette branche. L'exe publié reste celui de l'exécution validée.
          gh release create "v${{ steps.version.outputs.version }}" publication/GestionCompte.exe \
            --title "Mon Budget ${{ steps.version.outputs.version }}" --notes-file notes.md \
            --target "${{ github.event.repository.default_branch }}"
          if [ "${{ github.event_name }}" = push ]; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}" || echo "Branche ${{ github.ref_name }} à supprimer à la main."
          fi

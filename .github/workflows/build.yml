name: Application Windows

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Tests, .exe et captures d'écran
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/GestionCompte.Tests -c Release

      # Identifiant d'application Google (secrets du dépôt GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET), chiffré dans l'exe
      # comme le fait GoogleIntegre.Chiffrer ; sans ces secrets, l'application le demande à la connexion.
      - name: Identifiants Google
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) { Write-Host 'Pas de secrets Google : identifiant demandé à la connexion.'; exit 0 }
          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.Key = [System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes('Mon Budget - Google'))
          $aes.GenerateIV()
          $texte = [System.Text.Encoding]::UTF8.GetBytes("$($env:GOOGLE_CLIENT_ID.Trim())`n$($env:GOOGLE_CLIENT_SECRET.Trim())")
          $chiffre = $aes.EncryptCbc($texte, $aes.IV)
          $donnees = [Convert]::ToBase64String([byte[]]($aes.IV + $chiffre))
          $fichier = 'src/GestionCompte.Presentation/GoogleIntegre.cs'
          $source = Get-Content $fichier -Raw
          if (-not $source.Contains('"__GOOGLE_INTEGRE__"')) { throw 'Emplacement des identifiants Google introuvable.' }
          [System.IO.File]::WriteAllText((Resolve-Path $fichier), $source.Replace('"__GOOGLE_INTEGRE__"', "`"$donnees`""))
          Write-Host 'Identifiants Google intégrés (chiffrés).'

      - name: Création du .exe
        run: >
          dotnet publish src/GestionCompte.App/GestionCompte.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publication

      - name: Captures d'écran
        shell: pwsh
        timeout-minutes: 5
        run: |
          $dossier = Join-Path $PWD 'captures'
          $processus = Start-Process -FilePath 'publication/GestionCompte.exe' -ArgumentList '--captures', "`"$dossier`"" -PassThru -Wait
          if (Test-Path "$dossier/erreur.txt") { Get-Content "$dossier/erreur.txt" }
          if ($processus.ExitCode -ne 0) { throw "Captures en échec (code $($processus.ExitCode))" }
          Get-ChildItem $dossier

      # Les captures sont aussi déposées dans la branche « captures » (un seul commit, remplacé à chaque fois)
      # pour pouvoir les consulter sans télécharger d'artefact.
      - name: Captures dans la branche « captures »
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location captures
          git init -q -b captures
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.png
          git commit -q -m "Captures d'écran de $env:GITHUB_REF_NAME ($env:GITHUB_SHA)"
          git push -q --force "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" captures

      - name: Publication du .exe
        uses: actions/upload-artifact@v4
        with:
          name: GestionCompte-windows
          path: publication/GestionCompte.exe

      - name: Publication des captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: captures/
          if-no-files-found: ignore
